# Настройки mouse_pointer_focuser.
#
# Файлов два, оба лежат рядом с app.py:
#   config.toml          — ваши настройки, их и правят (меню трея → «Настройки»);
#   config.template.toml — значения по умолчанию; config.toml создаётся его копией.
# Всё, чего в config.toml нет, берётся из шаблона: ключ можно просто удалить из config.toml, и
# будет действовать значение по умолчанию.
#
# Ошибка синтаксиса в config.toml → действует весь шаблон, а в логе предупреждение.
# Значение не того типа (строка вместо числа и т.п.) → для этого ключа берётся значение шаблона.
#
# Когда что применяется:
#   monitor, monitor_name, focus_window — со следующего нажатия;
#   hotkey                              — после перезапуска (меню трея → «Перезапустить»).

# Сочетание, по которому курсор прыгает на монитор: модификаторы ctrl, alt, shift, super через
# '+', последней — клавиша (имя X keysym: j, F9, space, Pause, KP_1 …). Неразборчивое значение →
# значение шаблона. Если сочетание уже занято другой программой, его не удастся захватить —
# в логе будет ошибка, выберите другое.
hotkey = "ctrl+alt+shift+m"

# На какой монитор ставить курсор. Мониторы нумеруются с 1 слева направо (при равенстве —
# сверху вниз). Какой из них какой, проще всего узнать опытом: поставьте 1, нажмите сочетание,
# посмотрите, куда прыгнул курсор, и при необходимости поменяйте число. Список мониторов с
# номерами есть в меню трея → «Мониторы» (там же можно прыгнуть на любой).
# Номер больше числа мониторов → берётся последний.
monitor = 1

# Имя выхода монитора (как в `xrandr --listmonitors`: DP-1, HDMI-0 …). Если не пусто — важнее
# номера: курсор идёт на этот монитор, где бы он ни стоял. Если такого монитора сейчас нет —
# используется номер.
monitor_name = ""

# Делать ли активным окно, оказавшееся под курсором, после прыжка. true — клавиатура сразу
# пишет в это окно; false — курсор просто переносится, фокус остаётся где был.
focus_window = true
